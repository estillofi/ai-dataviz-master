name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # Python 3.9 недоступен на ubuntu-latest (26.04); набор обещает 3.9+
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: python tests/lint_kit.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate example skill
        run: python tools/validate_skill.py 02-references/examples/acme-dataviz
